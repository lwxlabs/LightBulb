name: Build and test
on:
  workflow_dispatch:
  push:
    branches:
      - lwxlabs-2.7.1
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore LightBulb.slnx
      - run: dotnet build LightBulb.slnx -c Release --no-restore -p:CSharpier_Bypass=true
      - run: dotnet test LightBulb.slnx -c Release --no-build --no-restore